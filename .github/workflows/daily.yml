name: Daily News Roundup
on:
  workflow_dispatch:
    inputs:
      preview_only:
        description: Generate HTML preview without emailing
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - '.github/mail-test-request.txt'
  schedule:
    - cron: '0,17,37 9 * * *'
      timezone: 'America/Los_Angeles'
permissions:
  contents: write
concurrency:
  group: daily-news-roundup
  cancel-in-progress: false
jobs:
  roundup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate and deliver
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NEWSLETTER_SENDER_EMAIL: ${{ secrets.NEWSLETTER_SENDER_EMAIL }}
          NEWSLETTER_RECIPIENT_EMAIL: ${{ secrets.NEWSLETTER_RECIPIENT_EMAIL }}
          PREVIEW_ONLY: ${{ inputs.preview_only }}
        run: |
          if [ "$PREVIEW_ONLY" = "true" ]; then
            python newsletter.py --preview
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            python newsletter.py --scheduled
          else
            python newsletter.py
          fi
      - name: Attach preview
        if: inputs.preview_only == true
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-preview
          path: preview.html
          retention-days: 7
      - name: Save delivery state and sent article history
        if: inputs.preview_only != true
        run: |
          if [ -f history.json ] || [ -f delivery_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add history.json delivery_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update emailed stories"
              git push
            fi
          fi
