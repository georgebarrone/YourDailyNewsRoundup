name: Daily News Roundup
on:
  workflow_dispatch:
    inputs:
      preview_only:
        description: Generate HTML preview without emailing
        type: boolean
        default: true
  schedule:
    # Daily Pacific delivery attempts. Later slots serve as backups; 
    # newsletter.py --scheduled skips sending a second edition on the same day.
    - cron: '6,28,34 12 * * *'
      timezone: 'America/Los_Angeles'
permissions:
  contents: write
concurrency:
  group: daily-news-roundup
  cancel-in-progress: false
jobs:
  roundup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Rerunning an older failed run should still use the latest code and
          # delivery state, rather than a stale SHA from the original attempt.
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate and deliver
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NEWSLETTER_SENDER_EMAIL: ${{ secrets.NEWSLETTER_SENDER_EMAIL }}
          NEWSLETTER_RECIPIENT_EMAIL: ${{ secrets.NEWSLETTER_RECIPIENT_EMAIL }}
          PREVIEW_ONLY: ${{ inputs.preview_only }}
        run: |
          if [ "$PREVIEW_ONLY" = "true" ]; then
            python newsletter.py --preview
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            python newsletter.py --scheduled
          else
            python newsletter.py
          fi
      - name: Attach preview
        if: inputs.preview_only == true
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-preview
          path: preview.html
          retention-days: 7
      - name: Save delivery state and sent article history
        if: inputs.preview_only != true
        run: |
          if [ -f history.json ] || [ -f delivery_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add history.json delivery_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update emailed stories"
              # Code or documentation may have changed while the newsletter
              # was being generated. Rebase the history-only commit onto
              # current main before pushing rather than rejecting it.
              for attempt in 1 2 3; do
                git fetch origin main
                if ! git rebase origin/main; then
                  git rebase --abort
                  echo "Could not merge delivery history with newer remote changes" >&2
                  exit 1
                fi
                if git push origin HEAD:main; then
                  exit 0
                fi
                echo "Remote moved during history update (attempt $attempt); retrying" >&2
                sleep 3
              done
              echo "Could not save delivery history after 3 pushes" >&2
              exit 1
            fi
          fi
